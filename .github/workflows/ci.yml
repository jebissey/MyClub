name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Style (phpcbf/phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      # phpcs.xml (à la racine de WebSite) définit déjà le chemin (app),
      # les exclusions et la règle PSR12 — on lance donc la même commande qu'en local.
      - name: Check coding style (phpcs, PSR-12)
        working-directory: WebSite
        run: vendor/bin/phpcs

  phpstan:
    name: Analyse statique (PHPStan niveau 9)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: WebSite
        run: vendor/bin/phpstan analyse --memory-limit=1G

  tests:
    name: Tests unitaires / métier
    runs-on: ubuntu-latest
    needs: phpstan
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        working-directory: WebSite
        run: vendor/bin/phpunit

  route-tests:
    name: FlightRouteTester
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      # En CI il n'y a pas d'utilisateur www-data ni de sudo pertinent :
      # on prépare juste les dossiers nécessaires au serveur de dev.
      - name: Prepare WebSite runtime folders
        working-directory: WebSite
        run: |
          mkdir -p data var/latte/temp var/tracy/log backup
          chmod -R 775 data var backup

      # Démarre le serveur PHP intégré en arrière-plan, comme dev-server.sh,
      # mais sans les étapes chown/sudo qui n'ont pas de sens en CI.
      - name: Start dev server
        working-directory: WebSite
        run: |
          nohup php -S localhost:8000 ../dev/router.php > ../server.log 2>&1 &
          echo $! > ../server.pid

      # Cette requête sert aussi à déclencher Database::check(), qui copie
      # automatiquement data/MyClub.sqlite depuis le template s'il n'existe pas
      # encore — nécessaire avant que route_tester.php ne tente de le sauvegarder.
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://localhost:8000; then
              echo "Server is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not start in time"
          cat server.log
          exit 1

      - name: Verify MyClub.sqlite was created from template
        run: |
          if [ ! -f WebSite/data/MyClub.sqlite ]; then
            echo "WebSite/data/MyClub.sqlite was not created — check Database::check() / router.php"
            cat server.log
            exit 1
          fi

      - name: Run FlightRouteTester
        run: |
          php test/route_tester.php \
            --base-url=http://localhost:8000 \
            --stop \
            --export-json \
            --export-csv

      - name: Upload route test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-test-results
          path: |
            route_test_results.json
            route_test_results.csv
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true