name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Style (phpcbf/phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      # phpcs.xml (at the root of WebSite) already defines the path (app),
      # the exclusions and the PSR12 rule — so we just run the same command as locally.
      - name: Check coding style (phpcs, PSR-12)
        working-directory: WebSite
        run: vendor/bin/phpcs

  phpstan:
    name: Analyse statique (PHPStan niveau 9)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        working-directory: WebSite
        run: vendor/bin/phpstan analyse --memory-limit=1G

  tests:
    name: Tests unitaires / métier
    runs-on: ubuntu-latest
    needs: phpstan
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check for missing unit tests
        working-directory: WebSite
        run: php ../test/CheckMissingTests.php

      - name: Run PHPUnit
        working-directory: WebSite
        run: vendor/bin/phpunit

  route-tests:
    name: FlightRouteTester
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
          extensions: pdo_sqlite, sqlite3

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: WebSite/vendor
          key: composer-${{ hashFiles('WebSite/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        working-directory: WebSite
        run: composer install --no-interaction --no-progress --prefer-dist

      # There is no www-data user or relevant sudo in CI:
      # we just prepare the folders needed by the dev server.
      - name: Prepare WebSite runtime folders
        working-directory: WebSite
        run: |
          mkdir -p data var/latte/temp var/tracy/log backup
          chmod -R 775 data var backup

      # Starts the built-in PHP server in the background, like dev-server.sh,
      # but without the chown/sudo steps that don't make sense in CI.
      - name: Start dev server
        working-directory: WebSite
        run: |
          nohup php -S localhost:8000 ../dev/router.php > ../server.log 2>&1 &
          echo $! > ../server.pid

      # This request also triggers Database::check(), which automatically
      # copies data/MyClub.sqlite from the template if it doesn't exist
      # yet — required before FlightRouteTester.php tries to back it up.
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://localhost:8000; then
              echo "Server is up"
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not start in time"
          cat server.log
          exit 1

      - name: Verify MyClub.sqlite was created from template
        run: |
          if [ ! -f WebSite/data/MyClub.sqlite ]; then
            echo "WebSite/data/MyClub.sqlite was not created — check Database::check() / router.php"
            cat server.log
            exit 1
          fi

      - name: Run FlightRouteTester
        run: |
          php test/FlightRouteTester.php \
            --base-url=http://localhost:8000 \
            --stop \
            --export-json \
            --export-csv

      - name: Upload route test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-test-results
          path: |
            route_test_results.json
            route_test_results.csv
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Show server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true